name: Gerar app iOS Nexo Alpha

# Executado manualmente (Actions > Gerar app iOS Nexo Alpha > Run workflow).
# Runners macOS consomem mais minutos do GitHub, por isso não roda a cada push.
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      APP_TITLE: Nexo
      APP_LOWER: nexo
      BUNDLE_ID: br.com.nexofinancas.nexofinancas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          brew install autoconf automake libtool pkg-config libjpeg || true
          brew link libtool || true
          python -m pip install --upgrade pip
          python -m pip install wheel sh "Cython==0.29.36" "kivy-ios==2025.5.17"

      - name: Cache do kivy-ios (Python e Kivy compilados)
        uses: actions/cache@v4
        with:
          path: |
            build
            dist
          key: kivy-ios-2025.5.17-${{ runner.arch }}

      - name: Compilar Python + Kivy para iOS
        run: toolchain build python3 kivy

      - name: Preparar pasta do app (somente código e imagens)
        run: |
          mkdir -p app_ios
          cp *.py *.png app_ios/
          ls -la app_ios

      - name: Criar projeto Xcode
        run: |
          rm -rf "${APP_LOWER}-ios"
          toolchain create "$APP_TITLE" app_ios
          ls "${APP_LOWER}-ios"

      - name: Compilar para o Simulador do iOS
        run: |
          xcodebuild -project "${APP_LOWER}-ios/${APP_LOWER}.xcodeproj" \
            -scheme "$APP_LOWER" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build_sim \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build

      - name: Compilar para iPhone (sem assinatura) e gerar .ipa
        run: |
          xcodebuild -project "${APP_LOWER}-ios/${APP_LOWER}.xcodeproj" \
            -scheme "$APP_LOWER" -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_device \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO build
          APP_PATH=$(find build_device -name "*.app" -path "*Release-iphoneos*" | head -n 1)
          echo "App gerado: $APP_PATH"
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          (cd ipa && zip -qry "../Nexo-Alpha-0.1-unsigned.ipa" Payload)

      - name: Enviar .ipa (sem assinatura)
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-Alpha-0.1-iOS
          path: Nexo-Alpha-0.1-unsigned.ipa
          if-no-files-found: error
