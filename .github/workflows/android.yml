name: Gerar APK Nexo Alpha

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    # Mudanças só no workflow do iOS (ou em textos) não geram APK novo.
    paths-ignore:
      - ".github/workflows/ios.yml"
      - "**.md"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - ".github/workflows/ios.yml"
      - "**.md"

jobs:
  build-android:
    # Mesma base usada pelo próprio python-for-android (Docker ubuntu:22.04).
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17 (exigido pelo Gradle/AGP 8)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake autopoint gettext libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake ccache libffi-dev libssl-dev lbzip2 patch

      - name: Instalar Buildozer
        # Não instale python-for-android via pip: o buildozer clona a versão
        # definida em "p4a.branch" no buildozer.spec. Ter duas versões
        # diferentes (pip x clone) causava conflito de dependências.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.6.0" "cython==0.29.36" setuptools

      - name: Baixar python-for-android (commit fixo com correções)
        # Por que não usar a tag v2026.05.09:
        #  1) ela instala os pacotes Python com o pip do host (x86_64), sem as
        #     tags de plataforma Android. Desde que o PyPI passou a ter wheels
        #     Android (ex.: charset_normalizer 3.5.2 para arm64), o build falha com
        #     "charset_normalizer-...-android_24_arm64_v8a.whl is not a supported
        #     wheel on this platform" (e no armeabi-v7a instalava o chardet
        #     compilado para x86_64, que não funcionaria no celular);
        #  2) bug do venv/pip 26 "BuildDependencyInstallError" (issue #3364).
        # Ambos foram corrigidos no branch develop (PR #3360 e PR #3366), mas
        # ainda não há tag nova. Fixamos um commit específico para o build ser
        # reproduzível. Quando sair uma versão nova do p4a, troque P4A_COMMIT.
        env:
          P4A_COMMIT: 725804ad06527fbfacb514add9a67ea7e7ee8683
        run: |
          rm -rf "$HOME/p4a-nexo"
          git init -q "$HOME/p4a-nexo"
          cd "$HOME/p4a-nexo"
          git remote add origin https://github.com/kivy/python-for-android.git
          git fetch -q --depth 1 origin "$P4A_COMMIT"
          git checkout -q FETCH_HEAD
          git log -1 --format='p4a em uso: %H (%cd)'
          # Confere se a correção do PR #3366 está presente (pip com tags Android, sem venv).
          if grep -q "'venv'" pythonforandroid/build.py; then
            echo "ERRO: este commit do p4a ainda usa o venv antigo; escolha um commit mais novo."; exit 1
          fi

      - name: Cache do Buildozer (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Compilar APK de testes
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        # O log completo vai para buildozer.log (enviado como artefato se falhar)
        # e as últimas linhas, onde costuma estar o erro, para erro_resumo.txt.
        run: |
          set +e
          buildozer -v android debug 2>&1 | tee buildozer.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            sed 's/\x1b\[[0-9;]*m//g' buildozer.log | tail -n 300 > erro_resumo.txt
          fi
          exit $status

      - name: Enviar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-Alpha-0.1-Android
          path: bin/*.apk
          if-no-files-found: error

      - name: Enviar log em caso de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-erro-android
          path: |
            erro_resumo.txt
            buildozer.log
          if-no-files-found: ignore
