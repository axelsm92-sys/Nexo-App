name: Gerar app iOS Nexo Alpha

# Roda manualmente (Actions > Gerar app iOS Nexo Alpha > Run workflow) e,
# automaticamente, só quando o próprio ios.yml é alterado.
# Runners macOS consomem mais minutos do GitHub, por isso não roda a cada push.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/ios.yml"

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 150
    defaults:
      run:
        # pipefail: se o comando falhar, a etapa falha mesmo com o "| tee" do log.
        shell: bash -o pipefail -e {0}
    env:
      APP_TITLE: Nexo
      APP_LOWER: nexo
      BUNDLE_ID: br.com.nexofinancas.nexofinancas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          echo "== macOS: $(sw_vers -productVersion) | Xcode: $(xcodebuild -version | head -1) | $(python --version)" | tee -a ios_build.log
          brew install autoconf automake libtool pkg-config libjpeg 2>&1 | tee -a ios_build.log || true
          brew link libtool || true
          python -m pip install --upgrade pip 2>&1 | tee -a ios_build.log
          python -m pip install wheel sh "Cython==0.29.36" "kivy-ios==2025.5.17" 2>&1 | tee -a ios_build.log

      - name: Cache do kivy-ios (Python e Kivy compilados)
        uses: actions/cache@v4
        with:
          path: |
            build
            dist
          key: kivy-ios-2025.5.17-${{ runner.arch }}

      - name: Compilar Python + Kivy para iOS
        run: |
          toolchain build python3 openssl kivy 2>&1 | tee -a ios_build.log
          # certifi: certificados para HTTPS (integração Pluggy).
          toolchain pip install certifi 2>&1 | tee -a ios_build.log

      - name: Preparar pasta do app (somente código e imagens)
        run: |
          mkdir -p app_ios
          cp *.py *.png app_ios/
          # Ícones da barra inferior e dos botões (sem isso o app fica sem imagens).
          cp -R icones app_ios/
          ls -la app_ios app_ios/icones

      - name: Criar projeto Xcode
        run: |
          rm -rf "${APP_LOWER}-ios"
          toolchain create "$APP_TITLE" app_ios 2>&1 | tee -a ios_build.log
          ls "${APP_LOWER}-ios"

      - name: Compilar para o Simulador do iOS
        run: |
          xcodebuild -project "${APP_LOWER}-ios/${APP_LOWER}.xcodeproj" \
            -scheme "$APP_LOWER" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build_sim \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build 2>&1 | tee -a ios_build.log

      - name: Compilar para iPhone (sem assinatura) e gerar .ipa
        run: |
          xcodebuild -project "${APP_LOWER}-ios/${APP_LOWER}.xcodeproj" \
            -scheme "$APP_LOWER" -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_device \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a ios_build.log
          APP_PATH=$(find build_device -name "*.app" -path "*Release-iphoneos*" | head -n 1)
          echo "App gerado: $APP_PATH"
          if [ -z "$APP_PATH" ]; then echo "ERRO: .app do iPhone não foi gerado"; exit 1; fi
          # Conferências: binário para iPhone (arm64), ícones e tamanho do pacote.
          lipo -info "$APP_PATH/$APP_LOWER" || file "$APP_PATH/$APP_LOWER"
          ls "$APP_PATH/YourApp/icones" 2>/dev/null || find "$APP_PATH" -maxdepth 3 -name icones
          du -sh "$APP_PATH"
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          (cd ipa && zip -qry "../Nexo-Alpha-0.1-unsigned.ipa" Payload)

      - name: Enviar .ipa (sem assinatura)
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-Alpha-0.1-iOS
          path: Nexo-Alpha-0.1-unsigned.ipa
          if-no-files-found: error

      - name: Resumo do log
        if: always()
        run: |
          # Últimas linhas (onde costuma estar o erro) + linhas com "error".
          { echo "=== ULTIMAS 300 LINHAS ==="; tail -n 300 ios_build.log 2>/dev/null;
            echo; echo "=== LINHAS COM ERRO ==="; grep -n -i -E "error|failed|exception" ios_build.log 2>/dev/null | tail -n 80; } > erro_resumo_ios.txt || true

      - name: Publicar log do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-ios
          path: |
            erro_resumo_ios.txt
            ios_build.log
          if-no-files-found: ignore
